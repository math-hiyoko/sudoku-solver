version: 0.2

env:
  git-credential-helper: yes

phases:
  install:
    commands:
      - echo "Installing dependencies..."
      - dnf -y upgrade
      - dnf -y install gcc14-c++ libcurl-devel make tar gzip xz zip
      - export CC=gcc14-gcc CXX=gcc14-g++
      - |
        CMAKE_VERSION=4.5.1
        CMAKE_ARCH=$(uname -m)
        case "$CMAKE_ARCH" in
          x86_64) CMAKE_SHA256=83b71181fb62b4fe8f26067a9321448572e7a43bd04ff6c7f54a24c33698f16d ;;
          aarch64) CMAKE_SHA256=3bec208f11ed96c173032eeaf97937c54dd246acefee22acd7794a6b4e70d536 ;;
          *) echo "Unsupported CMake architecture: $CMAKE_ARCH" >&2; exit 1 ;;
        esac
        CMAKE_RELEASE="cmake-${CMAKE_VERSION}-linux-${CMAKE_ARCH}"
        export CMAKE_TOOLS_DIR="$CODEBUILD_SRC_DIR/backend/build/toolchain"
        mkdir -p "$CMAKE_TOOLS_DIR"
        curl -fsSL --retry 3 "https://github.com/Kitware/CMake/releases/download/v${CMAKE_VERSION}/${CMAKE_RELEASE}.tar.gz" \
          -o "$CMAKE_TOOLS_DIR/$CMAKE_RELEASE.tar.gz"
        printf '%s  %s\n' "$CMAKE_SHA256" "$CMAKE_TOOLS_DIR/$CMAKE_RELEASE.tar.gz" | sha256sum -c -
        tar -xzf "$CMAKE_TOOLS_DIR/$CMAKE_RELEASE.tar.gz" -C "$CMAKE_TOOLS_DIR"
        export PATH="$CMAKE_TOOLS_DIR/$CMAKE_RELEASE/bin:$PATH"

  pre_build:
    commands:
      - echo "Setting up the environment..."
      - export VERSION=$(grep -oP '\[\K[0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | head -1)
      - |
        if [ "$CODEBUILD_WEBHOOK_TRIGGER" == "branch/main" ]; then
          export FUCTION_NAME="SudokuSolverBackend"
          export CMAKE_BUILD_TYPE="Release"
          export GIT_REVISION=$(git rev-list HEAD --count)
          export ARTIFACT_NAME="${CMAKE_BUILD_TYPE}/${VERSION}/${GIT_REVISION}"
        else
          export FUCTION_NAME="SudokuSolverBackendStage"
          export CMAKE_BUILD_TYPE="Debug"
          export DATE=$(date +%Y%m%d%H%M%S)
          export ARTIFACT_NAME="${CMAKE_BUILD_TYPE}/${VERSION}/${DATE}"
        fi
      - echo "CMAKE_BUILD_TYPE=$CMAKE_BUILD_TYPE"
      - echo "VERSION=$VERSION"
      - echo "ARTIFACT_NAME=$ARTIFACT_NAME"

  build:
    commands:
      - git -C "$CODEBUILD_SRC_DIR" submodule update --init
      - cd $CODEBUILD_SRC_DIR/backend
      - echo "Building external projects..."
      - |
        BOOST_VERSION=1.92.0
        BOOST_RELEASE="boost-${BOOST_VERSION}-cmake"
        BOOST_SHA256=9bed76128d4e46755dbe818487788c6fceb6f72b378f4daa49b7e1e600d9088d
        curl -fsSL --retry 3 "https://github.com/boostorg/boost/releases/download/boost-${BOOST_VERSION}/${BOOST_RELEASE}.tar.xz" \
          -o "$CMAKE_TOOLS_DIR/$BOOST_RELEASE.tar.xz"
        printf '%s  %s\n' "$BOOST_SHA256" "$CMAKE_TOOLS_DIR/$BOOST_RELEASE.tar.xz" | sha256sum -c -
        mkdir -p "$CMAKE_TOOLS_DIR/boost"
        tar -xJf "$CMAKE_TOOLS_DIR/$BOOST_RELEASE.tar.xz" -C "$CMAKE_TOOLS_DIR/boost" --strip-components=1
        cmake -S "$CMAKE_TOOLS_DIR/boost" \
              -B build/dependencies/boost-build \
              -DCMAKE_BUILD_TYPE="$CMAKE_BUILD_TYPE" \
              -DCMAKE_INSTALL_PREFIX="$PWD/build/dependencies" \
              -DBUILD_SHARED_LIBS=OFF \
              -DBOOST_INCLUDE_LIBRARIES='json;pool'
        cmake --build build/dependencies/boost-build -j
        cmake --install build/dependencies/boost-build
      - |
        cmake -S extern/aws-lambda-cpp/ \
              -B build/dependencies/aws-lambda-cpp-build \
              -DCMAKE_BUILD_TYPE="$CMAKE_BUILD_TYPE" \
              -DCMAKE_INSTALL_PREFIX="$PWD/build/dependencies" \
              -DAWS_LAMBDA_CPP_VERSION=1.0.1 \
              -DBUILD_SHARED_LIBS=OFF
        cmake --build build/dependencies/aws-lambda-cpp-build -j
        cmake --install build/dependencies/aws-lambda-cpp-build
      - echo "Building the application..."
      - |
        cmake -S . \
              -B build \
              -DCMAKE_BUILD_TYPE="$CMAKE_BUILD_TYPE" \
              -DCMAKE_PREFIX_PATH="$PWD/build/dependencies"
        cmake --build build -j
      - echo "Running Tests..."
      - ctest --test-dir build --verbose --output-on-failure -j
      - echo "Running Benchmarks..."
      - ./bin/bench
      - echo "Building package..."
      - cmake --build build --target aws-lambda-package-SudokuSolverBackend

  post_build:
    commands:
      - |
        if [ "$CODEBUILD_WEBHOOK_TRIGGER" == "branch/main" ]; then
          echo "Tagging the version..."
          git tag ${VERSION}-${GIT_REVISION}
          git push origin ${VERSION}-${GIT_REVISION}
          echo "Tagged the version: ${VERSION}-${GIT_REVISION}"
        fi
        if [ -f $CODEBUILD_SRC_DIR/backend/build/src/handler/SudokuSolverBackend.zip ]; then
          echo "Uploading to aws lambda"
          aws lambda update-function-code --function-name $FUCTION_NAME --zip-file fileb://$CODEBUILD_SRC_DIR/backend/build/src/handler/SudokuSolverBackend.zip
        fi

reports:
  unittest-reports:
    base-directory: backend/build/tests/unittest-reports
    files: "*.xml"
    discard-paths: yes
    file-format: JUNITXML

artifacts:
  files: backend/build/src/handler/SudokuSolverBackend.zip
  name: $ARTIFACT_NAME
  discard-paths: yes
